services:
  heimdall:
    build:
      context: ./heimdall/ConsultationBackend
      dockerfile: Dockerfile
    container_name: consultation_backend
    restart: unless-stopped
    ports:
        - "5001:8080"
    environment:
      - ConnectionStrings__Postgres=Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - MongoDbSettings__ConnectionString=mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongo:27017
      - MongoDbSettings__DatabaseName=${MONGO_DB}
      - Services__LLM__BaseUrl=http://odin:11434
      - Services__Pdf__BaseUrl=http://saga:3000
      - Services__Email__BaseUrl=http://hermes:8025
      - Services__SpeechToText__BaseUrl=http://echo:3000
    env_file: .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      echo:
        condition: service_started
      saga:
        condition: service_healthy
      hermes:
        condition: service_started

  janus:
    build:
      context: ./janus/BookingBackend
      dockerfile: Dockerfile
    container_name: booking_backend
    restart: unless-stopped
    ports:
      - "5050:8080"
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      echo:
        condition: service_started
      saga:
        condition: service_healthy
      hermes:
        condition: service_started
      heimdall:
        condition: service_healthy
    env_file: .env
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - Services__Email__BaseUrl=http://hermes:8025

  odin:
    build:
      context: ./odin
      dockerfile: Dockerfile
    container_name: ollama
    restart: unless-stopped
    profiles: [llm]
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"

  hermes:
    image: axllent/mailpit
    container_name: mailpit
    restart: unless-stopped
    volumes:
        - hermes_data:/data
    ports:
        - 8025:8025 # Web UI
        - 1025:1025 # SMTP
    environment:
        MP_MAX_MESSAGES: 5000
        MP_DATABASE: /data/mailpit.db
        # app can use any credential without TLS 
        # dev/testing
        MP_SMTP_AUTH_ACCEPT_ANY: 1 
        MP_SMTP_AUTH_ALLOW_INSECURE: 1

  echo:
    build:
      context: ./echo
      dockerfile: Dockerfile
    container_name: faster-whisper
    restart: unless-stopped
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3000/ping')"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 120s

      
  saga:
    build:
      context: ./saga
      dockerfile: Dockerfile
    container_name: typst
    restart: unless-stopped
    ports:
      - "3001:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  eir:
    build:
      context: ./eir
      dockerfile: Dockerfile
    container_name: eir_frontend
    restart: unless-stopped
    ports:
      - "3002:3000"
    env_file:
      - .env
      - ./eir/.env
    environment:
      - APP_BASE_URL=http://localhost:3002
      - AUTH0_BASE_URL=http://localhost:3002
    depends_on:
      heimdall:
        condition: service_started

  iris:
    build:
      context: ./iris
      dockerfile: Dockerfile
    container_name: iris_frontend
    restart: unless-stopped
    ports:
      - "3003:3000"
    env_file:
      - .env
      - ./iris/.env
    environment:
      - APP_BASE_URL=http://localhost:3003
      - AUTH0_AUDIENCE=${BOOKING_AUTH0_AUDIENCE}
      - AUTH0_BASE_URL=http://localhost:3003
    depends_on:
      janus:
        condition: service_started

  postgres:
    image: postgres:16
    container_name: postgres
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  mongo:
    image: mongo:7.0
    container_name: mongo
    restart: unless-stopped
    env_file: .env
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DB}
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    volumes:
      - mongodata:/data/db
    ports:
      - "${MONGO_PORT:-27017}:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')", "--quiet"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  ollama_data:
  hermes_data:
  pgdata:
  mongodata:


